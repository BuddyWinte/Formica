<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formica - Friendly Forms</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Segoe UI', 'Arial', sans-serif;
    }
    body {
      background: #e0f7f1;
      color: #333;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    border-radius: 0 0 25px 25px;
    background: #77d9b6;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background 0.3s;
  }

  .navbar:hover {
    background: #6cc9a4;
  }

  .navbar h1 {
    font-size: 2rem;
    color: #fff;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s;
  }

  .navbar h1:hover {
    transform: scale(1.1);
  }

  .nav-right a {
    text-decoration: none;
    color: #fff;
    margin-left: 15px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 25px;
    transition: background 0.2s, transform 0.2s;
  }

  .nav-right a:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.05);
  }


  .nav-right a.cta {
    background: #3eb489;
    padding: 10px 25px;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .nav-right a.cta:hover {
    background: #36a37f;
    transform: scale(1.1);
  }

    main {
      flex: 1;
      padding: 60px 20px;
      text-align: center;
    }

    main h2 {
      font-size: 3rem;
      color: #3eb489;
      margin-bottom: 15px;
    }
    main p {
      font-size: 1.3rem;
      color: #444;
      margin-bottom: 30px;
    }

    .cta-button {
      background: #3eb489;
      color: #fff;
      padding: 15px 35px;
      border: none;
      border-radius: 20px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .cta-button:hover {
      transform: scale(1.05);
      background: #36a37f;
    }
    section.features {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 50px;
      flex-wrap: wrap;
    }
    .feature-card {
      background: #d9f3ed;
      padding: 25px;
      border-radius: 20px;
      width: 260px;
      box-shadow: 2px 6px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .feature-card:hover {
      transform: translateY(-7px);
    }
    .feature-card h3 {
      margin-bottom: 12px;
      color: #3eb489;
    }

    footer {
      background: #a6e3d0;
      padding: 20px 40px;
      text-align: center;
      color: #333;
      border-top: 2px solid #77d9b6;
    }
    .mascot {
      width: 120px;
      height: 120px;
      background: #3eb489;
      border-radius: 50%;
      margin: 25px auto;
      position: relative;
      animation: bounce 2s infinite;
    }
    .mascot::after {
      content: "😺";
      font-size: 4rem;
      position: absolute;
      top: 15%;
      left: 15%;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @media (max-width: 768px) {
      section.features {
        flex-direction: column;
        align-items: center;
      }
      nav {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
