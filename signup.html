<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Inconsolata:wght@200..900&family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      if (localStorage.getItem("token")) {
        window.location.href = "index.html";
      }
    </script>
    <title>Formika - Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <h1>
          <img id="navbar-logo" src="imgs/3.png" alt="Formika Logo" /> Formika
        </h1>
      </div>
      <div class="nav-right">
        <a href="index.html">Home</a>
        <a href="#">Features</a>
        <a href="#" class="cta">Login</a>
      </div>
    </nav>
    <main>
      <h2>Join the Fun!</h2>
      <p>Create your account and start making friendly forms!</p>
      <form id="signup-form">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
        />
        <div class="error" id="username-error"></div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <div class="error" id="email-error"></div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
        <div class="password-strength" id="password-strength">
          Strength: weak
        </div>
        <div class="error" id="password-error"></div>
        <button type="submit">Get Started</button>
      </form>
      <div class="mascot"><img src="imgs/3.png" alt="Formika Logo" /></div>
    </main>
    <footer>
      &copy; 2025 Formika. All rights reserved. Fun forms for everyone!
    </footer>
    <script>
const passwordInput = document.getElementById('password');
const passwordStrength = document.getElementById('password-strength');

passwordInput.addEventListener('input', () => {
  const val = passwordInput.value;
  let score = 0;
  // this sucks...WE GOTTA RECODE IT :sob: - buddywinte
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  if (score <= 1) {
    passwordStrength.textContent = "Strength: weak";
    passwordStrength.className = "password-strength weak";
  } else if (score === 2) {
    passwordStrength.textContent = "Strength: medium";
    passwordStrength.className = "password-strength medium";
  } else if (score === 3 || score === 4) {
    passwordStrength.textContent = "Strength: strong";
    passwordStrength.className = "password-strength strong";
  } else {
    passwordStrength.textContent = "Strength: very strong";
    passwordStrength.className = "password-strength very-strong";
  }
});
</script>
<script>
const signupForm = document.getElementById("signup-form");
signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("username-error").textContent = "";
  document.getElementById("email-error").textContent = "";
  document.getElementById("password-error").textContent = "";
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try {
    const response = await fetch("https://formika.buddywinte.workers.dev/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password }),
    });
    const data = await response.json();
    if (response.ok) {
      const token = data.token;
      localStorage.setItem("token",token);
      window.location.href = "index.html";
    } else {
      if (data.error) {
        if (data.error.includes("Username")) {
          document.getElementById("username-error").textContent = data.error;
        } else if (data.error.includes("email")) {
          document.getElementById("email-error").textContent = data.error;
        } else {
          document.getElementById("password-error").textContent = data.error;
        }
      }
    }
  } catch (err) {
    console.error("Network or parsing error:", err);
    alert("Something went wrong. Please try again later.");
  }
});
</script>
  </body>
</html>
