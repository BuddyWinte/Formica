  <body>
    <nav class="navbar">
      <div class="nav-left">

    <main>
      <h2>Welcome Back</h2>
      <form id="signup-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <div class="error" id="email-error"></div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
        <div class="password-strength" id="password-strength">
          Strength: weak
        </div>
        <div class="error" id="password-error"></div>
        <button type="submit">Get Started</button>
        <div class="alt-link">
            Want to create an account?
            <a href="signup.html">Sign up here</a>
        </div>
      </form>
      <div class="mascot"><img src="imgs/3.png" alt="Formika Logo" /></div>
    </main>
    <footer>
      &copy; 2025 Formika. All rights reserved. Fun forms for everyone!
    </footer>
<script>
const loginForm = document.getElementById("signup-form");
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("email-error").textContent = "";
  document.getElementById("password-error").textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try {
    const response = await fetch("https://formika.buddywinte.workers.dev/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await response.json();
    if (response.ok) {
      localStorage.setItem("token", data.token);
      window.location.href = "index.html";
    } else {
      if (data.error.includes("Email")) {
        document.getElementById("email-error").textContent = data.error;
      } else if (data.error.includes("Password")) {
        document.getElementById("password-error").textContent = data.error;
      } else {
        document.getElementById("password-error").textContent = "Login failed.";
      }
    }
  } catch (err) {
    console.error("Network or server error:", err);
    alert("Something went wrong. Please try again later.");
  }
});
</script>
